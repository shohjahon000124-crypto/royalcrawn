<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Homer Donut Blast - Мобильная версия</title>
<style>
* {
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    box-sizing: border-box;
}

body {
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive;
    background: linear-gradient(145deg, #fde68a, #fbbf24);
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* Главный контейнер - адаптивный */
.game-container {
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
    padding: 8px;
}

/* Заголовок */
h1 { 
    color: #c2410c; 
    font-size: clamp(24px, 7vw, 42px); 
    text-shadow: 3px 3px 0 #ffedb0;
    margin: 5px 0 5px;
    text-align: center;
    letter-spacing: -0.5px;
}

/* Верхняя панель - фиксированная и удобная */
.top-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 10px 12px;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(12px);
    z-index: 200;
    gap: 8px;
    flex-wrap: wrap;
}

#coins { 
    background: #2d1b0ecc;
    padding: 6px 14px;
    border-radius: 40px;
    color: #ffdd88;
    font-size: 16px;
    font-weight: bold;
    border: 1px solid #ffb347;
    white-space: nowrap;
}

#allTimeEaten {
    background: #2d1b0ecc;
    padding: 6px 14px;
    border-radius: 40px;
    color: #ffaa66;
    font-size: 14px;
    font-weight: bold;
    white-space: nowrap;
}

/* Сцена с Гомером */
#scene { 
    position: relative; 
    background: radial-gradient(ellipse at 50% 100%, #f5e6b0, #e2bc6e);
    border-radius: 50px;
    padding: 15px 10px;
    margin: 65px 0 10px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    border: 3px solid #ffaa44;
    min-height: 320px;
    touch-action: manipulation;
}

#homer { 
    width: 220px;
    max-width: 75%;
    display: block;
    margin: 0 auto;
    transition: width 0.3s cubic-bezier(0.34, 1.2, 0.64, 1), transform 0.15s ease;
    filter: drop-shadow(6px 10px 8px rgba(0,0,0,0.3));
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

/* Сообщения */
#message {
    position: absolute;
    top: -50px;
    left: 50%;
    transform: translateX(-50%);
    font-size: clamp(12px, 3.5vw, 18px);
    font-weight: bold;
    color: #9b2c00;
    background: rgba(255,250,200,0.98);
    padding: 5px 12px;
    border-radius: 30px;
    white-space: nowrap;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    border-left: 6px solid #ff7e33;
    border-right: 6px solid #ff7e33;
    pointer-events: none;
    z-index: 20;
}

/* Большой счетчик */
#eatenBig {
    background: #2d1b0ecc;
    backdrop-filter: blur(12px);
    padding: 6px 12px;
    border-radius: 50px;
    margin: 8px 0;
    text-align: center;
}

#eatenBig span {
    font-size: clamp(28px, 8vw, 44px);
    font-weight: bold;
    color: #ffaa33;
    text-shadow: 2px 2px 0 #5a2a00;
    background: #1f1b12;
    padding: 3px 12px;
    border-radius: 40px;
    margin: 0 4px;
    display: inline-block;
}

#eatenBig .label {
    font-size: clamp(14px, 3.5vw, 20px);
    color: #ffdd99;
}

#needToExplode {
    font-size: 14px;
    background: #5a2a00aa;
    padding: 4px 10px;
    border-radius: 30px;
    display: inline-block;
    margin-top: 4px;
    color: #ffcc88;
}

/* Пончики - адаптивный размер */
.donut {
    width: clamp(55px, 14vw, 75px);
    cursor: pointer;
    position: absolute;
    transition: all 0.15s ease;
    filter: drop-shadow(3px 5px 5px rgba(0,0,0,0.3));
    z-index: 15;
    touch-action: manipulation;
}
.donut:active {
    transform: scale(0.92);
}

/* Магазин - секции */
.shop-sections {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 10px 0;
}

.shop-card {
    background: linear-gradient(135deg, #ffecd2, #ffd6a5);
    border-radius: 40px;
    padding: 10px 15px;
    border: 2px solid #ff9f4a;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.shop-title {
    font-size: clamp(16px, 4.5vw, 22px);
    font-weight: bold;
    color: #b64508;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    justify-content: center;
}

.shop-buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
}

.shop-btn {
    background: linear-gradient(145deg, #ff9142, #ff6a22);
    border: none;
    font-size: clamp(14px, 3.8vw, 18px);
    font-weight: bold;
    padding: 10px 16px;
    border-radius: 50px;
    color: white;
    text-shadow: 1px 1px 0 #a33f00;
    cursor: pointer;
    transition: 0.05s linear;
    font-family: inherit;
    box-shadow: 0 3px 0 #9b4a1a;
    flex: 1;
    min-width: 110px;
    touch-action: manipulation;
}
.shop-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #9b4a1a;
}

.revive-btn {
    background: linear-gradient(145deg, #c2410c, #9b2c00);
    box-shadow: 0 3px 0 #6a1e00;
}

/* Статистика смертей */
#deathStats {
    background: #1f1b12cc;
    backdrop-filter: blur(8px);
    padding: 6px 12px;
    border-radius: 35px;
    font-size: 12px;
    font-weight: bold;
    color: #ffaa66;
    text-align: center;
    margin: 5px auto;
    width: fit-content;
}

/* Анимации */
@keyframes pop {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
}
.coin-pop {
    position: absolute;
    font-size: 20px;
    pointer-events: none;
    animation: pop 0.4s ease-out forwards;
    font-weight: bold;
    color: gold;
    text-shadow: 1px 1px 0 orange;
    z-index: 200;
}

@keyframes explodeAnim {
    0% { transform: scale(1); opacity: 1; filter: blur(0px);}
    50% { transform: scale(1.4); opacity: 0.8; filter: blur(4px);}
    100% { transform: scale(2); opacity: 0; filter: blur(12px);}
}
.explode {
    animation: explodeAnim 0.5s ease-out forwards;
    pointer-events: none;
}

.shake {
    animation: shakeAnim 0.3s ease-in-out;
}
@keyframes shakeAnim {
    0%,100%{ transform: translateX(0);}
    25%{ transform: translateX(-5px);}
    75%{ transform: translateX(5px);}
}

/* Для очень маленьких экранов */
@media (max-width: 450px) {
    .top-bar { padding: 8px 10px; }
    #coins, #allTimeEaten { font-size: 12px; padding: 4px 10px; }
    #scene { margin-top: 58px; padding: 12px 8px; min-height: 280px; }
    #homer { width: 180px; }
    .shop-card { padding: 8px 12px; }
    .shop-btn { padding: 8px 12px; min-width: 90px; font-size: 13px; }
    .shop-title { margin-bottom: 8px; }
    #deathStats { font-size: 10px; }
}

/* Для iPhone SE и подобных */
@media (max-width: 380px) {
    #homer { width: 160px; }
    .donut { width: 55px; }
    #scene { min-height: 260px; }
}
</style>
</head>
<body>
<div class="game-container">
    <h1>🍩 Прожорливый Гомер 💥</h1>
    
    <div class="top-bar">
        <div id="coins">💰 20</div>
        <div id="allTimeEaten">🏆 Всего: 0</div>
    </div>
    
    <div id="scene">
        <div id="message">🍩 Жми на пончики!</div>
        <img id="homer" src="https://i.imgur.com/lR8ZTl0.png" alt="Гомер" 
             onerror="this.src='https://cdn-icons-png.flaticon.com/512/1998/1998612.png'">
    </div>
    
    <div id="eatenBig">
        <span class="label">🍩 СЪЕДЕНО</span>
        <span id="currentEatenDisplay">0</span>
        <div id="needToExplode">💥 До взрыва: <span id="toExplodeCount">20</span> 💥</div>
    </div>
    
    <div class="shop-sections">
        <div class="shop-card">
            <div class="shop-title">🍩 ОБЫЧНЫЕ ПОНЧИКИ 🍩</div>
            <div class="shop-buttons">
                <button class="shop-btn" id="buyDonutBtn">🍩 Купить (1💰)</button>
            </div>
        </div>
        
        <div class="shop-card">
            <div class="shop-title">✨ МЕГА-ПОНЧИКИ ✨</div>
            <div class="shop-buttons">
                <button class="shop-btn" id="buySpecialBtn">⭐ Мега (3💰) +6-8💰</button>
            </div>
        </div>
        
        <div class="shop-card">
            <div class="shop-title">💀 ВОСКРЕШЕНИЕ 💀</div>
            <div class="shop-buttons">
                <button class="shop-btn revive-btn" id="buyHomerBtn">👤 Воскресить (20💰)</button>
            </div>
        </div>
    </div>
    
    <div id="deathStats">💀 Смертей: 0 | Цена: 20 | Нужно: 20</div>
</div>

<script>
// ================== ИГРОВЫЕ ДАННЫЕ ==================
let coinCount = 20;
let totalEatenCurrentLife = 0;
let totalEatenAllTime = 0;
let deathCount = 0;
let reviveCost = 20;
let requiredEatenToExplode = 20;
let homerWidth = 220; // Начальная ширина для мобилки
let gameActive = true;
let explosionTriggered = false;

const scene = document.getElementById("scene");
const coinsDisplay = document.getElementById("coins");
const messageDiv = document.getElementById("message");
const homerImg = document.getElementById("homer");
const currentEatenDisplay = document.getElementById("currentEatenDisplay");
const toExplodeCountSpan = document.getElementById("toExplodeCount");
const deathStatsSpan = document.getElementById("deathStats");
const allTimeEatenSpan = document.getElementById("allTimeEaten");

let donutsArray = [];

// РЕЦЕПТЫ ПОНЧИКОВ
const donutRecipes = [
    { img: "https://i.imgur.com/RjZ0H0O.png", flavor: "клубничный 🍓", value: 2 },
    { img: "https://i.imgur.com/B0f0M0P.png", flavor: "шоколадный 🍫", value: 2 },
    { img: "https://i.imgur.com/0gD1X0R.png", flavor: "банановый 🍌", value: 2 },
    { img: "https://i.imgur.com/RjZ0H0O.png", flavor: "вишневый 🍒", value: 2 },
    { img: "https://i.imgur.com/B0f0M0P.png", flavor: "карамельный 🍯", value: 2 },
    { img: "https://i.imgur.com/0gD1X0R.png", flavor: "черничный 🫐", value: 2 }
];

const specialDonuts = [
    { img: "https://i.imgur.com/RjZ0H0O.png", flavor: "✨ РАДУЖНЫЙ ✨", value: 6, isSpecial: true },
    { img: "https://i.imgur.com/B0f0M0P.png", flavor: "💎 ЗОЛОТОЙ 💎", value: 7, isSpecial: true },
    { img: "https://i.imgur.com/0gD1X0R.png", flavor: "🌈 ВОЛШЕБНЫЙ 🌈", value: 8, isSpecial: true }
];

function getRandomDonut() {
    return { ...donutRecipes[Math.floor(Math.random() * donutRecipes.length)] };
}
function getRandomSpecialDonut() {
    return { ...specialDonuts[Math.floor(Math.random() * specialDonuts.length)] };
}

function showCoinEffect(x, y, amount) {
    const effect = document.createElement("div");
    effect.className = "coin-pop";
    effect.textContent = `+${amount}💰`;
    effect.style.left = x + "px";
    effect.style.top = y + "px";
    effect.style.position = "absolute";
    document.body.appendChild(effect);
    setTimeout(() => effect.remove(), 500);
}

function updateUI() {
    currentEatenDisplay.textContent = totalEatenCurrentLife;
    let need = requiredEatenToExplode - totalEatenCurrentLife;
    if (need < 0) need = 0;
    toExplodeCountSpan.textContent = need;
    coinsDisplay.textContent = `💰 ${coinCount}`;
    allTimeEatenSpan.innerHTML = `🏆 Всего: ${totalEatenAllTime}`;
    deathStatsSpan.innerHTML = `💀 Смертей: ${deathCount} | Воскрешение: ${reviveCost}💰 | Нужно: ${requiredEatenToExplode}`;
    
    const reviveBtn = document.getElementById("buyHomerBtn");
    reviveBtn.innerHTML = `👤 Воскресить (${reviveCost}💰)`;
}

// ДОБАВЛЕНИЕ ПОНЧИКА РЯДОМ С ГОМЕРОМ (только по запросу)
function addDonutAroundHomer(donutData = null) {
    if (!gameActive) return null;
    
    const sceneRect = scene.getBoundingClientRect();
    const homerRect = homerImg.getBoundingClientRect();
    const centerX = (homerRect.left + homerRect.width/2) - sceneRect.left;
    const centerY = (homerRect.top + homerRect.height/2) - sceneRect.top;
    
    const angle = Math.random() * Math.PI * 2;
    const radius = Math.random() * 100 + 55; // Радиус поменьше для мобилок
    let x = centerX + Math.cos(angle) * radius;
    let y = centerY + Math.sin(angle) * radius - 15;
    
    const maxX = scene.clientWidth - 70;
    const minX = 10;
    const maxY = scene.clientHeight - 70;
    const minY = 25;
    x = Math.min(maxX, Math.max(minX, x));
    y = Math.min(maxY, Math.max(minY, y));
    
    const data = donutData || getRandomDonut();
    const donutImg = document.createElement("img");
    donutImg.src = data.img;
    donutImg.classList.add("donut");
    donutImg.style.left = x + "px";
    donutImg.style.top = y + "px";
    donutImg.setAttribute("data-flavor", data.flavor);
    donutImg.setAttribute("data-value", data.value);
    if (data.isSpecial) donutImg.setAttribute("data-special", "true");
    
    scene.appendChild(donutImg);
    donutImg.onclick = (e) => {
        e.stopPropagation();
        if (!gameActive) {
            messageDiv.textContent = `💀 Гомер мёртв! Воскреси за ${reviveCost}💰!`;
            return;
        }
        eatDonut(donutImg, data);
    };
    donutsArray.push(donutImg);
    return donutImg;
}

function eatDonut(donutElement, donutInfo) {
    if (!gameActive) return;
    
    const reward = donutInfo.value || 2;
    coinCount += reward;
    totalEatenCurrentLife += 1;
    totalEatenAllTime += 1;
    
    updateUI();
    
    let msgText = `😋 ${donutInfo.flavor} +${reward}💰`;
    if (donutInfo.isSpecial) msgText = `🌟🌟🌟 ${donutInfo.flavor} +${reward}💰 🌟🌟🌟`;
    messageDiv.textContent = msgText;
    
    const rect = donutElement.getBoundingClientRect();
    showCoinEffect(rect.left + rect.width/2, rect.top + rect.height/2, reward);
    
    let newWidth = homerWidth + 10;
    let maxWidth = window.innerWidth < 450 ? 320 : 380;
    if (newWidth > maxWidth) newWidth = maxWidth;
    homerWidth = newWidth;
    homerImg.style.width = homerWidth + "px";
    
    homerImg.style.transform = "rotate(-6deg) scale(1.02)";
    setTimeout(() => homerImg.style.transform = "rotate(5deg) scale(1.01)", 80);
    setTimeout(() => homerImg.style.transform = "rotate(0deg) scale(1)", 200);
    
    homerImg.style.filter = "drop-shadow(0 0 10px gold)";
    setTimeout(() => homerImg.style.filter = "drop-shadow(6px 10px 8px rgba(0,0,0,0.3))", 200);
    
    donutElement.remove();
    donutsArray = donutsArray.filter(d => d !== donutElement);
    
    // Проверка взрыва
    if (gameActive && totalEatenCurrentLife >= requiredEatenToExplode && !explosionTriggered) {
        explodeHomer();
    }
}

// ВЗРЫВ
function explodeHomer() {
    if (explosionTriggered) return;
    explosionTriggered = true;
    gameActive = false;
    deathCount++;
    
    messageDiv.textContent = `💥💥 БАХ! Гомер взорвался! ${totalEatenCurrentLife}/${requiredEatenToExplode} 💥💥`;
    
    document.body.classList.add("shake");
    setTimeout(() => document.body.classList.remove("shake"), 400);
    
    homerImg.classList.add("explode");
    
    const boomDiv = document.createElement("div");
    boomDiv.textContent = "💥💣💥";
    boomDiv.style.position = "absolute";
    boomDiv.style.fontSize = "55px";
    boomDiv.style.left = "50%";
    boomDiv.style.top = "50%";
    boomDiv.style.transform = "translate(-50%, -50%)";
    boomDiv.style.pointerEvents = "none";
    boomDiv.style.zIndex = "200";
    boomDiv.style.fontWeight = "bold";
    scene.appendChild(boomDiv);
    setTimeout(() => boomDiv.remove(), 500);
    
    for (let d of donutsArray) {
        if (d && d.remove) d.remove();
    }
    donutsArray = [];
    
    setTimeout(() => {
        homerImg.style.opacity = "0";
        homerImg.style.visibility = "hidden";
    }, 450);
    
    requiredEatenToExplode = requiredEatenToExplode * 2;
    reviveCost = reviveCost * 2;
    
    updateUI();
}

// ВОСКРЕШЕНИЕ
function reviveHomer() {
    if (gameActive) {
        messageDiv.textContent = "Гомер уже жив!";
        return;
    }
    if (coinCount >= reviveCost) {
        coinCount -= reviveCost;
        
        gameActive = true;
        explosionTriggered = false;
        homerWidth = window.innerWidth < 450 ? 180 : 220;
        totalEatenCurrentLife = 0;
        
        homerImg.style.opacity = "1";
        homerImg.style.visibility = "visible";
        homerImg.classList.remove("explode");
        homerImg.style.width = homerWidth + "px";
        homerImg.style.transform = "scale(1)";
        homerImg.style.filter = "drop-shadow(6px 10px 8px rgba(0,0,0,0.3))";
        
        messageDiv.textContent = `🎉 Гомер воскрес! Нужно съесть ${requiredEatenToExplode} пончиков! 🎉`;
        
        setTimeout(() => {
            if (gameActive && donutsArray.length === 0) {
                for(let i = 0; i < 4; i++) {
                    addDonutAroundHomer();
                }
                messageDiv.textContent = `🍩 4 пончика! Покупай ещё в магазине 🍩`;
            }
        }, 200);
        
        updateUI();
    } else {
        messageDiv.textContent = `😭 Нужно ${reviveCost}💰! У тебя ${coinCount} 😭`;
        setTimeout(() => {
            if (!gameActive) messageDiv.textContent = `💀 Собери ${reviveCost}💰 и воскреси!`;
        }, 2000);
    }
}

// =============== МАГАЗИН ===============
document.getElementById("buyDonutBtn").onclick = () => {
    if (!gameActive) {
        messageDiv.textContent = `Гомер мёртв! Воскреси за ${reviveCost}💰!`;
        return;
    }
    if (coinCount >= 1) {
        coinCount -= 1;
        updateUI();
        addDonutAroundHomer(getRandomDonut());
        messageDiv.textContent = "🛒 Пончик куплен!";
        setTimeout(() => {
            if (gameActive) messageDiv.textContent = "🍩 Жми на пончик! 🍩";
        }, 1000);
    } else {
        messageDiv.textContent = "😭 Нет монет! Ешь пончики!";
    }
};

document.getElementById("buySpecialBtn").onclick = () => {
    if (!gameActive) {
        messageDiv.textContent = `Гомер мёртв! Воскреси за ${reviveCost}💰!`;
        return;
    }
    if (coinCount >= 3) {
        coinCount -= 3;
        updateUI();
        addDonutAroundHomer(getRandomSpecialDonut());
        messageDiv.textContent = "✨ Мега-пончик! +6-8💰 ✨";
    } else {
        messageDiv.textContent = "💔 Нужно 3💰!";
    }
};

document.getElementById("buyHomerBtn").onclick = () => {
    reviveHomer();
};

// СТАРТ
function startGame() {
    gameActive = true;
    explosionTriggered = false;
    deathCount = 0;
    reviveCost = 20;
    requiredEatenToExplode = 20;
    totalEatenCurrentLife = 0;
    totalEatenAllTime = 0;
    homerWidth = window.innerWidth < 450 ? 180 : 220;
    coinCount = 20;
    
    homerImg.style.opacity = "1";
    homerImg.style.visibility = "visible";
    homerImg.classList.remove("explode");
    homerImg.style.width = homerWidth + "px";
    
    updateUI();
    
    for (let d of donutsArray) {
        if (d && d.remove) d.remove();
    }
    donutsArray = [];
    
    for(let i = 0; i < 4; i++) {
        addDonutAroundHomer();
    }
    messageDiv.textContent = "🍩 4 пончика! Покупай новые в магазине! 💥";
}

homerImg.addEventListener("click", () => {
    if (gameActive) {
        let left = requiredEatenToExplode - totalEatenCurrentLife;
        messageDiv.textContent = `🤤 Гомер: «Осталось ${left} пончиков!» 🤤`;
        homerImg.style.transform = "scale(1.02) rotate(3deg)";
        setTimeout(() => homerImg.style.transform = "", 200);
    } else {
        messageDiv.textContent = `💀 Гомер мёртв. Воскреси за ${reviveCost}💰!`;
    }
});

startGame();
</script>
</body>
</html>
